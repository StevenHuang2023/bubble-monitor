name: Refresh dashboard data

on:
  schedule:
    - cron: '0 22 * * 1-5'   # 每个工作日 ~美股收盘后（UTC 22:00）
    - cron: '0 9 * * 1-5'    # 每个工作日 ~港/A股收盘后（UTC 09:00）
  workflow_dispatch: {}       # 也可在 Actions 页手动点 Run workflow

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch data
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}   # 在仓库 Secret 里配，绝不写进代码
        run: python3 fetch.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json history.json
          git diff --staged --quiet || git commit -m "chore: refresh data $(date -u +%FT%TZ)"
          git push
